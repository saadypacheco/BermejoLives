# ============================================================
# Encontralo · PRODUCCIÓN (VPS Hostinger + Traefik)
# Sin puertos publicados: Traefik enruta por dominio vía labels.
# DB = Postgres + PostgREST self-hosted, EN ESTE MISMO VPS (ver selfhost/).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# DOMINIO: DOMAIN = dominio canónico (ej. encontralo.store).
#   DOMAIN_ALT (opcional) = segundo dominio servido en simultáneo durante la
#   migración (ej. buscadonde.com). Si no se setea, cae a DOMAIN (sin efecto).
#
# PRIMER DEPLOY DESPUÉS DE ESTE CAMBIO (contenedores sin root, ver auditoría 5/11):
#   El backend ahora corre como uid 1001 y el frontend como `node` (uid 1000). Los volúmenes
#   que ya existen se crearon cuando el backend corría como root: hay que pasárselos UNA vez,
#   ANTES del `up -d` (con el backend parado):
#     docker compose -f docker-compose.prod.yml --env-file .env run --rm --no-deps --user root \
#       --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --entrypoint chown backend \
#       -R 1001:1001 /models /data/fotos /data/content /data/wa_received
#   (el `cap_drop: [ALL]` del servicio se mantiene; el `run` le devuelve sólo esas tres capacidades.)
#   Además, ./data/pago/qr.png (carpeta del compose en el host) tiene que ser legible por todos
#   (chmod o+r), porque el backend ya no es root.
# ============================================================

# Rotación de logs: sin esto el log json-file de cada contenedor crece sin tope
# (se come el disco del VPS). 5 archivos de 10 MB por servicio.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Mayor fijada (17): los menores son sólo correcciones. Un cambio de mayor exige pg_upgrade,
    # y nunca debe pasar por un `up`.
    image: postgres:17-alpine
    container_name: buscadonde-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AUTHENTICATOR_PASSWORD=${AUTHENTICATOR_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./selfhost/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: buscadonde-postgrest
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/postgres
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
      - PGRST_DB_MAX_ROWS=1000
    networks: [traefik, internal]
    labels:
      # PASO 3 pendiente (auditoría 5/11, A-02): cuando el backend Y el frontend lean por la red
      # interna (http://buscadonde-postgrest:3000), este router se cierra: se sacan TODAS las
      # labels de abajo y la red `traefik` de este servicio, y se borra el DNS `db.`. Mientras
      # tanto el router sigue abierto, con tope de pedidos por IP (ratelimit).
      #
      # OJO CON EL ORDEN: el backend todavía le pega a https://db.${DOMAIN} (SUPABASE_URL de abajo)
      # y para Traefik es UNA sola IP: con el tope puesto, un backend que sigue por la URL
      # pública se queda sin cupo (30 pedidos por minuto). Deployá el backend con la URL interna
      # ANTES (o a la vez que) este ratelimit.
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.buscadonde-db.rule=Host(`db.${DOMAIN}`)"
      - traefik.http.routers.buscadonde-db.entrypoints=websecure
      - traefik.http.routers.buscadonde-db.tls=true
      - traefik.http.routers.buscadonde-db.tls.certresolver=letsencrypt
      - traefik.http.services.buscadonde-db.loadbalancer.server.port=3000
      # supabase-js/supabase-py agregan /rest/v1 solos (asumen el Kong de
      # Supabase Cloud) — PostgREST bare sirve las tablas en la raíz, así
      # que se lo sacamos acá antes de reenviar.
      # Primero el tope y después el stripprefix (un pedido rechazado no hace trabajo de más).
      - traefik.http.routers.buscadonde-db.middlewares=buscadonde-db-ratelimit,buscadonde-db-stripprefix
      - "traefik.http.middlewares.buscadonde-db-stripprefix.stripprefix.prefixes=/rest/v1"
      # 30 pedidos por minuto por IP, con ráfaga de 30. La IP es la de origen de la conexión; si
      # algún día el registro `db` pasa por el proxy de Cloudflare (naranja), todos se ven con la
      # IP de Cloudflare y el tope pasa a ser compartido: ahí hay que usar CF-Connecting-IP.
      - traefik.http.middlewares.buscadonde-db-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.buscadonde-db-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.buscadonde-db-ratelimit.ratelimit.burst=30
  waha:
    # Fijada por digest a la imagen que corría en prod el 5/11/2026 (era `latest`):
    # un `up` no debe cambiar el bridge de WhatsApp solo. Para actualizar, probar en QA
    # y cambiar el digest a mano (`docker image inspect --format '{{index .RepoDigests 0}}'`).
    image: devlikeapro/waha@sha256:527ff3d634925adb26d596883d7b3ca502c080f737af3c2af2be0c973c511533
    container_name: buscadonde-waha
    restart: unless-stopped
    logging: *logging
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      # Va al NOMBRE DEL CONTENEDOR, no al del servicio.
      #
      # `backend` resolvía a DOS contenedores: este proyecto y el de Reservalo
      # tienen un servicio con ese nombre, y como comparten la red de Traefik
      # los dos registraron el mismo alias. Docker repartía las peticiones entre
      # ambos, así que la mitad de los avisos de WhatsApp llegaban al backend de
      # Reservalo —que no tiene esta ruta— y volvían 404. La otra mitad llegaba
      # bien. Un canal que funciona una vez de cada dos es peor que uno roto:
      # parece intermitencia de red y no un error de configuración.
      #
      # `container_name` es único en todo el demonio de Docker, así que no puede
      # colisionar con otro proyecto.
      - WHATSAPP_HOOK_URL=http://buscadonde-backend:8000/ingest/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status,group.v2.join,group.v2.leave,group.v2.participants,group.v2.update
      - WHATSAPP_HOOK_HMAC_KEY=${WEBHOOK_SECRET}
      - WHATSAPP_DOWNLOAD_MEDIA=true
      # Protege el dashboard (ahí se escanea el QR para vincular el
      # número) — sin esto quedaría público, cualquiera podría re-vincular
      # la sesión a su propio celular.
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USER}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
      # Swagger (la documentación de la API) con las mismas credenciales que el dashboard:
      # sin esto WAHA inventa una clave nueva en cada arranque y la imprime en el log.
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_DASHBOARD_USER}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    # WAHA ya NO se publica por Traefik: la API y el dashboard no tienen por qué
    # estar en internet. El backend lo alcanza por la red `internal` y el WAHA le
    # avisa al backend por la misma red (WHATSAPP_HOOK_URL de arriba).
    # El dashboard (QR, estado de la sesión) se abre por túnel SSH:
    #   ssh -L 3010:127.0.0.1:3010 <vps>   y luego http://localhost:3010
    ports:
      - "127.0.0.1:3010:3000"
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        # La base (PostgREST) la lee el SERVIDOR de Next por la red interna de Docker, sin pasar
        # por Traefik ni por internet (lib/supabase.ts; la URL va SIN /rest/v1). Ya no se hornean
        # NEXT_PUBLIC_SUPABASE_* en el bundle del navegador: el navegador no habla con la base
        # (lee por /api/lectura) y `npm run check:bundle` lo verifica.
        # Van como build arg Y como `environment` (abajo): las páginas estáticas leen en el build y
        # el servidor lee en runtime. Ojo: BuildKit no entra a las redes del compose, así que en el
        # build `buscadonde-postgrest` no resuelve: por eso va también SUPABASE_URL (pública), que
        # lib/supabase.ts prefiere SOLO durante el build. Si no, sitemap, /que-es-uruku y
        # /comprar-en-bermejo salen sin datos y así se quedan hasta su revalidación (1 h a 1 día).
        # PASO 3: cuando `db.` se cierre, el build ya no podrá leer la base; habrá que dar otra
        # salida (p. ej. build con `network: host` o regenerar esas páginas tras el `up`).
        SUPABASE_INTERNAL_URL: http://buscadonde-postgrest:3000
        SUPABASE_URL: https://db.${DOMAIN}
        # Acepta el nombre nuevo o, mientras el .env del VPS no se renombre, el viejo.
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY}}
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        # El mapa base sale del caché propio (servicio `tiles`), no de OSM
        # directo. Se puede pisar por ciudad desde `ciudades.tiles_url` sin
        # tocar esto, que es para lo que existe esa columna.
        NEXT_PUBLIC_TILES_URL: https://tiles.${DOMAIN}/{z}/{x}/{y}.png
        # "1" = sitio en modo captura: solo /bermejo y /admin; el resto muestra "Próximamente".
        # Para abrir el sitio público: poné "0" y reconstruí el frontend.
        NEXT_PUBLIC_MODO_CAPTURA: ${MODO_CAPTURA:-1}
        # Versión: el deploy pasa GIT_SHA=$(git rev-parse --short HEAD); APP_ENV
        # etiqueta el ambiente (prod/qa). Se ven en el footer y en GET /version.
        GIT_SHA: ${GIT_SHA:-dev}
        APP_ENV: ${APP_ENV:-}
    container_name: buscadonde-frontend
    restart: unless-stopped
    logging: *logging
    environment:
      - SUPABASE_INTERNAL_URL=http://buscadonde-postgrest:3000
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY}}
    # Corre como `node` (no root). Sin capacidades de Linux y sin poder ganar privilegios (setuid):
    # Next sólo escucha en el 3003 y lee archivos, no necesita ninguna.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgrest:
        condition: service_started
    networks: [traefik, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      # El optimizador de imágenes de Next (/_next/image) está apagado en el código
      # (images.unoptimized) y además NO se enruta desde afuera: Traefik contesta 404.
      - "traefik.http.routers.buscadonde-fe.rule=(Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`) || Host(`${DOMAIN_ALT:-${DOMAIN}}`) || Host(`www.${DOMAIN_ALT:-${DOMAIN}}`)) && !PathPrefix(`/_next/image`)"
      - traefik.http.routers.buscadonde-fe.entrypoints=websecure
      - traefik.http.routers.buscadonde-fe.tls=true
      - traefik.http.routers.buscadonde-fe.tls.certresolver=letsencrypt
      - traefik.http.routers.buscadonde-fe.middlewares=buscadonde-headers
      - traefik.http.services.buscadonde-fe.loadbalancer.server.port=3003
      # Encabezados de seguridad (auditoría 5/11, M-07) para el sitio Y la API: la definición vive
      # acá y el router de la API la usa con `buscadonde-headers@docker`.
      #  - HSTS un año con subdominios: todos los subdominios (api., tiles., db.) ya van por https.
      #  - X-Frame-Options DENY: nadie puede meter el sitio ni el /admin en un iframe (clickjacking).
      #  - nosniff, Referrer-Policy y Permissions-Policy: cámara y micrófono (búsqueda por voz) y
      #    ubicación sólo para el propio sitio.
      # La CSP (en modo sólo reporte) la manda Next desde next.config.mjs.
      - traefik.http.middlewares.buscadonde-headers.headers.stsseconds=31536000
      - traefik.http.middlewares.buscadonde-headers.headers.stsincludesubdomains=true
      - traefik.http.middlewares.buscadonde-headers.headers.framedeny=true
      - traefik.http.middlewares.buscadonde-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.buscadonde-headers.headers.referrerpolicy=strict-origin-when-cross-origin
      - "traefik.http.middlewares.buscadonde-headers.headers.customresponseheaders.Permissions-Policy=geolocation=(self), camera=(self), microphone=(self)"

  # Tiles propios: un caché delante de OpenStreetMap. Ver selfhost/tiles/nginx.conf
  # para el porqué. En resumen: mil personas mirando el centro de Bermejo pasan a
  # ser UN pedido a OSM en vez de mil, y el mapa carga desde el mismo VPS.
  tiles:
    image: nginx:1.27-alpine
    container_name: uruku-tiles
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./selfhost/tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tiles_cache:/var/cache/tiles
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.uruku-tiles.rule=Host(`tiles.${DOMAIN}`)"
      - traefik.http.routers.uruku-tiles.entrypoints=websecure
      - traefik.http.routers.uruku-tiles.tls=true
      - traefik.http.routers.uruku-tiles.tls.certresolver=letsencrypt
      - traefik.http.services.uruku-tiles.loadbalancer.server.port=80

  backend:
    build:
      context: ./backend
      args:
        # Mismo GIT_SHA que el frontend. Sin esto no había forma de saber qué
        # backend corre: /version es del frontend, y el 11/9 se reconstruyó
        # sólo el backend y el sha que se veía era el viejo del frontend.
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: buscadonde-backend
    restart: unless-stopped
    logging: *logging
    env_file: ./backend/.env
    # Corre como uid 1001 (Dockerfile): sin capacidades y sin setuid. No necesita CAP_CHOWN: el
    # os.chown de la carpeta out/ del job de videos va al uid 1001 de reels, que es el mismo uid,
    # y chownear a uno mismo no pide privilegios. Escribe sólo en los volúmenes de abajo
    # (/models, /data/fotos, /data/content, /data/wa_received); ver el `chown -R` de arriba.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgrest:
        condition: service_started
      waha:
        condition: service_started
    environment:
      # supabase-py agrega /rest/v1 solo (asume el Kong de Supabase Cloud) —
      # por eso va por la URL pública con el stripprefix de Traefik, en vez
      # de pegarle directo a postgrest:3000 (que no tiene ese prefijo).
      - SUPABASE_URL=https://db.${DOMAIN}
      - FOTOS_PUBLIC_BASE_URL=https://api.${DOMAIN}/fotos
      # Al NOMBRE DEL CONTENEDOR, por lo mismo que el WHATSAPP_HOOK_URL de
      # arriba pero en el sentido contrario: `waha` es un alias en la red de
      # Traefik, y el día que otro proyecto del VPS tenga un servicio con ese
      # nombre Docker reparte las peticiones entre los dos. De este lado el
      # síntoma sería mudo: la foto se le pide al WAHA ajeno, falla, y la
      # oferta entra sin imagen una vez de cada dos.
      #
      # Va acá y no en backend/.env porque `environment` le gana a `env_file`:
      # el nombre del contenedor se define en este archivo, y así la URL no
      # puede quedar vieja en el .env de un VPS.
      - WAHA_BASE_URL=http://buscadonde-waha:3000
    volumes:
      - whisper_models:/models      # cache del modelo de transcripción (persiste entre rebuilds)
      - comercio_fotos:/data/fotos  # fotos de comercio (reemplaza a Supabase Storage)
      - wa_received:/data/wa_received  # fotos de desconocidos: PRIVADO, nunca bajo /data/fotos (se sirve por /fotos)
      # Banco de fotos y videos armados para las redes: PRIVADO, nunca bajo /data/fotos. Sólo se ven con URL firmada.
      - content_private:/data/content
      # QR de cobro (PAGO_QR_PATH=/data/pago/qr.png): carpeta del VPS, SOLO LECTURA para el backend.
      # No se sube desde el panel a propósito (docs/cobro-mensual.md, T7): se copia por scp,
      #   ssh <vps> "mkdir -p <carpeta del compose>/data/pago"
      #   scp qr.png <vps>:<carpeta del compose>/data/pago/qr.png
      # y el backend lo sirve por /pago/qr/imagen (re-codificado). Cambiarlo no pide reinicio.
      # El backend ya no es root: el archivo tiene que ser legible por otros (chmod o+r).
      - ./data/pago:/data/pago:ro
    # `render`: red interna compartida sólo con el armador de videos (reels).
    networks: [traefik, internal, render]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.buscadonde-be.rule=Host(`api.${DOMAIN}`) || Host(`api.${DOMAIN_ALT:-${DOMAIN}}`)"
      - traefik.http.routers.buscadonde-be.entrypoints=websecure
      - traefik.http.routers.buscadonde-be.tls=true
      - traefik.http.routers.buscadonde-be.tls.certresolver=letsencrypt
      # Encabezados de seguridad: el middleware lo define el frontend (más arriba).
      - traefik.http.routers.buscadonde-be.middlewares=buscadonde-headers@docker
      - traefik.http.services.buscadonde-be.loadbalancer.server.port=8000

  # Armador de videos 9:16 (docs/contenido-redes-tecnico.md, 16.4): Chromium fotografía
  # cada cuadro de una página HTML y ffmpeg arma el mp4. Sin puerto publicado, sin Traefik
  # y sin salida a internet: sólo está en la red `render` (internal: true), que comparte
  # únicamente con el backend. El backend lo llama por http://buscadonde-reels:8090.
  # Del volumen content_private sólo usa tmp/<piece_id>/ (lee las fotos, escribe video.mp4
  # y cover.jpg). RENDERER_TOKEN va en renderer/.env, igual al de backend/.env.
  reels:
    build:
      context: ./renderer
    container_name: buscadonde-reels
    restart: unless-stopped
    logging: *logging
    env_file: ./renderer/.env
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    read_only: true
    # Sin capacidades de Linux y sin poder ganar privilegios (setuid): el render corre como pwuser y no necesita ninguna.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m
    init: true
    volumes:
      - content_private:/data/content
    networks: [render]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  tiles_cache:
  whisper_models:
  postgres_data:
  comercio_fotos:
  wa_received:
  content_private:
  waha_sessions:
  waha_media:

networks:
  traefik:
    external: true
  internal:
  # Backend <-> reels. `internal: true`: sin salida a internet ni puertos al host.
  render:
    internal: true
