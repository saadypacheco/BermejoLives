# ============================================================
# Encontralo · PRODUCCIÓN (VPS Hostinger + Traefik)
# Sin puertos publicados: Traefik enruta por dominio vía labels.
# DB = Postgres + PostgREST self-hosted, EN ESTE MISMO VPS (ver selfhost/).
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# DOMINIO: DOMAIN = dominio canónico (ej. encontralo.store).
#   DOMAIN_ALT (opcional) = segundo dominio servido en simultáneo durante la
#   migración (ej. buscadonde.com). Si no se setea, cae a DOMAIN (sin efecto).
# ============================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: buscadonde-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AUTHENTICATOR_PASSWORD=${AUTHENTICATOR_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./selfhost/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: buscadonde-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/postgres
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${PGRST_JWT_SECRET}
      - PGRST_DB_MAX_ROWS=1000
    networks: [traefik, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.buscadonde-db.rule=Host(`db.${DOMAIN}`)"
      - traefik.http.routers.buscadonde-db.entrypoints=websecure
      - traefik.http.routers.buscadonde-db.tls=true
      - traefik.http.routers.buscadonde-db.tls.certresolver=letsencrypt
      - traefik.http.services.buscadonde-db.loadbalancer.server.port=3000
      # supabase-js/supabase-py agregan /rest/v1 solos (asumen el Kong de
      # Supabase Cloud) — PostgREST bare sirve las tablas en la raíz, así
      # que se lo sacamos acá antes de reenviar.
      - traefik.http.routers.buscadonde-db.middlewares=buscadonde-db-stripprefix
      - "traefik.http.middlewares.buscadonde-db-stripprefix.stripprefix.prefixes=/rest/v1"
  waha:
    image: devlikeapro/waha:latest
    container_name: buscadonde-waha
    restart: unless-stopped
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      # Va al NOMBRE DEL CONTENEDOR, no al del servicio.
      #
      # `backend` resolvía a DOS contenedores: este proyecto y el de Reservalo
      # tienen un servicio con ese nombre, y como comparten la red de Traefik
      # los dos registraron el mismo alias. Docker repartía las peticiones entre
      # ambos, así que la mitad de los avisos de WhatsApp llegaban al backend de
      # Reservalo —que no tiene esta ruta— y volvían 404. La otra mitad llegaba
      # bien. Un canal que funciona una vez de cada dos es peor que uno roto:
      # parece intermitencia de red y no un error de configuración.
      #
      # `container_name` es único en todo el demonio de Docker, así que no puede
      # colisionar con otro proyecto.
      - WHATSAPP_HOOK_URL=http://buscadonde-backend:8000/ingest/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
      - WHATSAPP_HOOK_HMAC_KEY=${WEBHOOK_SECRET}
      - WHATSAPP_DOWNLOAD_MEDIA=true
      # Protege el dashboard (ahí se escanea el QR para vincular el
      # número) — sin esto quedaría público, cualquiera podría re-vincular
      # la sesión a su propio celular.
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USER}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks: [traefik, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.buscadonde-waha.rule=Host(`waha.${DOMAIN}`)"
      - traefik.http.routers.buscadonde-waha.entrypoints=websecure
      - traefik.http.routers.buscadonde-waha.tls=true
      - traefik.http.routers.buscadonde-waha.tls.certresolver=letsencrypt
      - traefik.http.services.buscadonde-waha.loadbalancer.server.port=3000

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* se hornean en el bundle (apuntan a PostgREST self-hosted, https://db.$DOMAIN)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        # El mapa base sale del caché propio (servicio `tiles`), no de OSM
        # directo. Se puede pisar por ciudad desde `ciudades.tiles_url` sin
        # tocar esto, que es para lo que existe esa columna.
        NEXT_PUBLIC_TILES_URL: https://tiles.${DOMAIN}/{z}/{x}/{y}.png
        # "1" = sitio en modo captura: solo /bermejo y /admin; el resto muestra "Próximamente".
        # Para abrir el sitio público: poné "0" y reconstruí el frontend.
        NEXT_PUBLIC_MODO_CAPTURA: ${MODO_CAPTURA:-1}
        # Versión: el deploy pasa GIT_SHA=$(git rev-parse --short HEAD); APP_ENV
        # etiqueta el ambiente (prod/qa). Se ven en el footer y en GET /version.
        GIT_SHA: ${GIT_SHA:-dev}
        APP_ENV: ${APP_ENV:-}
    container_name: buscadonde-frontend
    restart: unless-stopped
    depends_on:
      postgrest:
        condition: service_started
    networks: [traefik, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.buscadonde-fe.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`) || Host(`${DOMAIN_ALT:-${DOMAIN}}`) || Host(`www.${DOMAIN_ALT:-${DOMAIN}}`)"
      - traefik.http.routers.buscadonde-fe.entrypoints=websecure
      - traefik.http.routers.buscadonde-fe.tls=true
      - traefik.http.routers.buscadonde-fe.tls.certresolver=letsencrypt
      - traefik.http.services.buscadonde-fe.loadbalancer.server.port=3003

  # Tiles propios: un caché delante de OpenStreetMap. Ver selfhost/tiles/nginx.conf
  # para el porqué. En resumen: mil personas mirando el centro de Bermejo pasan a
  # ser UN pedido a OSM en vez de mil, y el mapa carga desde el mismo VPS.
  tiles:
    image: nginx:1.27-alpine
    container_name: uruku-tiles
    restart: unless-stopped
    volumes:
      - ./selfhost/tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tiles_cache:/var/cache/tiles
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.uruku-tiles.rule=Host(`tiles.${DOMAIN}`)"
      - traefik.http.routers.uruku-tiles.entrypoints=websecure
      - traefik.http.routers.uruku-tiles.tls=true
      - traefik.http.routers.uruku-tiles.tls.certresolver=letsencrypt
      - traefik.http.services.uruku-tiles.loadbalancer.server.port=80

  backend:
    build: ./backend
    container_name: buscadonde-backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      postgrest:
        condition: service_started
      waha:
        condition: service_started
    environment:
      # supabase-py agrega /rest/v1 solo (asume el Kong de Supabase Cloud) —
      # por eso va por la URL pública con el stripprefix de Traefik, en vez
      # de pegarle directo a postgrest:3000 (que no tiene ese prefijo).
      - SUPABASE_URL=https://db.${DOMAIN}
      - FOTOS_PUBLIC_BASE_URL=https://api.${DOMAIN}/fotos
    volumes:
      - whisper_models:/models      # cache del modelo de transcripción (persiste entre rebuilds)
      - comercio_fotos:/data/fotos  # fotos de comercio (reemplaza a Supabase Storage)
    networks: [traefik, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - "traefik.http.routers.buscadonde-be.rule=Host(`api.${DOMAIN}`) || Host(`api.${DOMAIN_ALT:-${DOMAIN}}`)"
      - traefik.http.routers.buscadonde-be.entrypoints=websecure
      - traefik.http.routers.buscadonde-be.tls=true
      - traefik.http.routers.buscadonde-be.tls.certresolver=letsencrypt
      - traefik.http.services.buscadonde-be.loadbalancer.server.port=8000

volumes:
  tiles_cache:
  whisper_models:
  postgres_data:
  comercio_fotos:
  waha_sessions:
  waha_media:

networks:
  traefik:
    external: true
  internal:
