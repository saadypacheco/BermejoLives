# Puerta de la demo: hace de «Kong» de Supabase. supabase-js (front) y
# supabase-py (back) piden `/rest/v1/...`; PostgREST no tiene ese prefijo.
server {
  listen 80;
  client_max_body_size 20m;
  location /rest/v1/ {
    proxy_pass http://demo-manual-rest:3000/;
    proxy_set_header Host $host;
  }
  location = /health { return 200 "ok\n"; }
}
