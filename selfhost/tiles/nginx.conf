# Servidor de tiles propio de URUKU.
#
# QUÉ ES Y QUÉ NO ES
# ==================
#
# Es un CACHÉ delante de OpenStreetMap, no una copia del mapa del mundo. El
# primer pedido de cada tile va a OSM; a partir de ahí lo sirve este servidor,
# desde el mismo VPS que ya sirve el sitio.
#
# POR QUÉ ASÍ Y NO CON PMTILES DIRECTAMENTE
# =========================================
#
# PMTiles —un archivo propio, dibujado en el navegador— es la solución final:
# independencia total y estilo propio. Pero cambia el motor de dibujo del mapa,
# suma una dependencia de JavaScript y obliga a generar y mantener el archivo de
# 22 ciudades. Eso no se hace a días de arrancar.
#
# Esto, en cambio, se despliega en una tarde y se lleva casi todo el riesgo:
#
#   · Los usuarios dejan de pegarle a OSM. Con mil personas mirando el centro de
#     Bermejo, OSM ve UN pedido por tile en vez de mil. Se pasa de estar en el
#     borde de su política de uso a estar sobradamente adentro.
#   · El mapa carga más rápido acá: la tile sale del mismo servidor que el sitio.
#   · Si OSM se cae o corta, lo que ya está cacheado sigue funcionando 30 días.
#
# Y como `ciudades.tiles_url` es un dato, pasar de esto a PMTiles el día de
# mañana es un UPDATE en la base, sin deploy. Ésa es la razón de que la 0068
# exista.
#
# LO QUE NO HAY QUE HACER: bajarse el mapa entero para llenar el caché. La
# política de OSM prohíbe la descarga masiva, y este caché es legítimo
# justamente porque se llena con lo que la gente mira de verdad.

proxy_cache_path /var/cache/tiles levels=1:2 keys_zone=tiles:20m
                 max_size=4g inactive=60d use_temp_path=off;

# Resolver de Docker: sin esto nginx resuelve el host de OSM UNA vez al arrancar
# y se queda con esa IP para siempre. El día que OSM cambie de servidor, el mapa
# deja de andar y el error no dice nada.
resolver 127.0.0.11 8.8.8.8 valid=300s ipv6=off;

map $status $cacheable {
    default   0;
    200       1;
}

server {
    listen 80;
    server_name _;

    # Sin esto Traefik no sabe si el contenedor está vivo.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)\.png$ {
        # Sólo los zooms que el sitio usa. Sin este tope, un bot pidiendo
        # /25/… nos haría pedirle a OSM millones de tiles que no existen — y es
        # a NOSOTROS a quien OSM bloquearía por eso.
        if ($z !~ ^([0-9]|1[0-9])$) { return 404; }

        set $osm "https://tile.openstreetmap.org";
        proxy_pass $osm/$z/$x/$y.png;

        # La política de OSM exige un User-Agent que identifique a la
        # aplicación y permita contactarla. Un agente genérico es motivo de
        # bloqueo, y el bloqueo llega sin aviso.
        proxy_set_header User-Agent "URUKU/1.0 (+https://uruku.bo; hola@uruku.bo)";
        proxy_set_header Referer "https://uruku.bo/";
        proxy_set_header Host "tile.openstreetmap.org";
        proxy_ssl_server_name on;

        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        # Un 404 o un 500 también se guardan un rato: si no, cada recarga de una
        # zona sin datos vuelve a pedirle lo mismo a OSM.
        proxy_cache_valid 404 1h;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Diez navegadores pidiendo la misma tile nueva = UN pedido a OSM.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Tile-Cache $upstream_cache_status;
        # El navegador lo pide desde otro origen (uruku.bo → tiles.uruku.bo).
        add_header Access-Control-Allow-Origin "*";
    }

    location / { return 404; }
}
