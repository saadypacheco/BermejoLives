# ============================================================
# Bermejo Live Market · stack local en Docker
#
# Supabase corre aparte (npx supabase start, en el host, API :54421).
# Estos contenedores lo alcanzan así:
#   - backend / SSR del frontend  -> host.docker.internal:54421
#   - navegador (NEXT_PUBLIC_*)    -> localhost:54421
#
# Uso:  cd infra && docker compose up -d --build
# ============================================================
# Rotación de logs (sin esto el log json-file crece sin tope): 5 archivos de 10 MB por servicio.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build: ../backend
    container_name: bermejo-backend
    restart: unless-stopped
    logging: *logging
    # Corre como uid 1001 (backend/Dockerfile): sin capacidades ni setuid. Los volúmenes NUEVOS
    # heredan el dueño de la imagen; si ya tenés unos de antes (creados como root), pasalos una
    # vez con el comando de docker-compose.prod.yml (`run --user root --cap-add CHOWN ... chown -R 1001:1001`).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ../backend/.env
    environment:
      # override de la URL para alcanzar el Supabase del host desde el contenedor
      - SUPABASE_URL=http://host.docker.internal:54421
      # cómo lo alcanza el NAVEGADOR (para las URLs públicas de fotos en Storage)
      - SUPABASE_PUBLIC_URL=http://localhost:54421
      - FRONTEND_URL=http://localhost:3003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wa_received:/data/wa_received   # fotos de desconocidos: PRIVADO
      - content_private:/data/content   # banco de fotos y videos para redes: PRIVADO
    networks: [bermejonet, render]

  # Armador de videos 9:16 (docs/contenido-redes-tecnico.md, 16.4). Sin puertos publicados:
  # sólo el backend lo alcanza, por la red interna `render` (sin salida a internet).
  # Copiar renderer/.env.example a renderer/.env con el mismo RENDERER_TOKEN del backend.
  reels:
    build: ../renderer
    container_name: buscadonde-reels
    restart: unless-stopped
    logging: *logging
    env_file: ../renderer/.env
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    read_only: true
    # Sin capacidades de Linux y sin poder ganar privilegios (setuid): el render corre como pwuser y no necesita ninguna.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m
    init: true
    volumes:
      - content_private:/data/content
    networks: [render]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      args:
        # La base la lee el SERVIDOR de Next (build y runtime), no el navegador: ya no se hornean
        # NEXT_PUBLIC_SUPABASE_*. Con el Supabase local (Kong) el origen LLEVA /rest/v1.
        SUPABASE_INTERNAL_URL: "http://host.docker.internal:54421/rest/v1"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
        # Se hornea en el bundle del navegador → apunta al host
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: bermejo-frontend
    restart: unless-stopped
    logging: *logging
    # Corre como `node` (no root), sin capacidades ni setuid.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      # SSR dentro del contenedor → alcanza Supabase del host (el Kong local lleva /rest/v1)
      - SUPABASE_INTERNAL_URL=http://host.docker.internal:54421/rest/v1
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [backend]
    networks: [bermejonet]

  # Bridge de WhatsApp (igual que mentorcomercial). Red privada, webhook firmado.
  waha:
    image: devlikeapro/waha:latest
    container_name: bermejo-waha
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:4501:3000"          # SOLO localhost (4501 para no pisar mentorcomercial:4500)
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-bermejo-dev}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WHATSAPP_HOOK_URL=http://backend:8000/ingest/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status,group.v2.join,group.v2.leave,group.v2.participants,group.v2.update
      - WHATSAPP_HOOK_HMAC_KEY=${WEBHOOK_SECRET:-}
      - WHATSAPP_DOWNLOAD_MEDIA=true
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks: [bermejonet]
    profiles: ["whatsapp"]              # opcional: docker compose --profile whatsapp up

volumes:
  waha_sessions:
  waha_media:
  wa_received:
  content_private:

networks:
  bermejonet:
  # Backend <-> reels. `internal: true`: sin salida a internet ni puertos al host.
  render:
    internal: true
